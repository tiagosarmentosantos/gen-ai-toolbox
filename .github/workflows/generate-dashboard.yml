name: Generate & Publish Dashboard

on:
  schedule:
    # Run every Sunday at 9 AM UTC (adjust as needed)
    - cron: '0 9 * * 0'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config.json'
      - '.github/workflows/generate-dashboard.yml'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow writes to repo
      pages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any Python dependencies here if needed
      
      - name: Run pipeline
        env:
          STRAVA_DATA: ${{ secrets.STRAVA_DATA }}  # See step 4
        run: |
          mkdir -p docs
          python scripts/compute_metrics.py \
            --activities examples/activities_example.json \
            --end $(date +%Y-%m-%d) \
            --out work/metrics.json \
            --summary
          python scripts/render_dashboard.py \
            --metrics work/metrics.json \
            --coach examples/coach_example.json \
            --out docs/index.html
      
      - name: Deploy to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
      
      - name: Commit results (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore: update dashboard $(date +%Y-%m-%d)" || echo "No changes"
          git push
